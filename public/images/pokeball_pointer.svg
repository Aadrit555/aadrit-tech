<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <!-- Glowing Selection Aura -->
  <circle cx="14" cy="14" r="13" fill="#10b981" fill-opacity="0.25" stroke="#059669" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- Outer Dark Border -->
  <circle cx="14" cy="14" r="10" fill="#18181b"/>
  <!-- Top Bright Red Half -->
  <path d="M4.5 13 A 9.5 9.5 0 0 1 23.5 13 Z" fill="#ef4444"/>
  <!-- Specular Reflection Highlight -->
  <ellipse cx="10" cy="9" rx="3" ry="1.5" fill="#fecaca" transform="rotate(-30 10 9)" opacity="0.9"/>
  <!-- Bottom White Half -->
  <path d="M4.5 15 A 9.5 9.5 0 0 0 23.5 15 Z" fill="#ffffff"/>
  <!-- Middle Dividing Band -->
  <rect x="4" y="13" width="20" height="2" fill="#18181b"/>
  <!-- Center Outer Button Ring -->
  <circle cx="14" cy="14" r="4" fill="#18181b"/>
  <!-- Glowing Emerald Center Core -->
